name: Build Wordcloud Terms

on:
  workflow_dispatch:
  schedule:
    - cron: "15 * * * *"

jobs:
  build-wordcloud:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build wordcloud aggregates
        env:
          # NOTA (mantenimiento automático 2026-08-05): a fecha de hoy
          # SUPABASE_URL y SUPABASE_SERVICE_ROLE_KEY NO existen como
          # secrets del repositorio (verificado con `gh secret list`).
          # scripts/build_wordcloud_terms.py exige ambos con
          # env_required() y lanza RuntimeError si faltan. Hay que
          # añadirlos en Settings → Secrets and variables → Actions
          # (usar la service_role key de Supabase, nunca la anon key).
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_SOURCE_SCHEMA: ${{ vars.SUPABASE_SOURCE_SCHEMA || 'medios' }}
          SUPABASE_SOURCE_TABLE: ${{ vars.SUPABASE_SOURCE_TABLE || 'noticias' }}
          SUPABASE_TARGET_SCHEMA: ${{ vars.SUPABASE_TARGET_SCHEMA || 'medios' }}
          SUPABASE_TARGET_TABLE: ${{ vars.SUPABASE_TARGET_TABLE || 'wordcloud_terms' }}
          WORDCLOUD_MAX_TERMS: ${{ vars.WORDCLOUD_MAX_TERMS || '80' }}
          WORDCLOUD_MIN_DOC_FREQ: ${{ vars.WORDCLOUD_MIN_DOC_FREQ || '2' }}
        run: python scripts/build_wordcloud_terms.py
