# ──────────────────────────────────────────────────────────────────────────────
# Build Wordcloud Terms — ODESOCAN
# Recalcula el agregado textual `medios.wordcloud_terms` a partir de las
# noticias que el scraping diario deja en Supabase.
#
# ESTADO ACTUAL (auditoría 2026-08-28): el pipeline NO está aprovisionado.
# Faltan las tres piezas que documenta el README (sección "Word cloud
# agregada"). Mientras falte alguna, el paso de build se omite de forma
# controlada y el motivo se publica en el resumen del job, en lugar de
# reventar con un traceback en cada ejecución.
# ──────────────────────────────────────────────────────────────────────────────

name: Build Wordcloud Terms

on:
  workflow_dispatch:
  schedule:
    # Una vez al día, después del scraping diario ("Scraping medios canarios",
    # 10:00 UTC + ~15 min de ejecución). Antes era "15 * * * *" (cada hora):
    # 24 ejecuciones diarias para una fuente que solo cambia una vez al día.
    - cron: "0 12 * * *"

jobs:
  build-wordcloud:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Comprobar prerrequisitos
        id: preflight
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          faltan=()
          [ -n "$SUPABASE_URL" ]              || faltan+=("SUPABASE_URL")
          [ -n "$SUPABASE_SERVICE_ROLE_KEY" ] || faltan+=("SUPABASE_SERVICE_ROLE_KEY")

          if [ ${#faltan[@]} -eq 0 ]; then
            echo "listo=true" >> "$GITHUB_OUTPUT"
            echo "### ✅ Prerrequisitos presentes" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Se ejecuta \`scripts/build_wordcloud_terms.py\`." >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Si falla contra la base de datos, comprueba que \`supabase/wordcloud.sql\`" >> "$GITHUB_STEP_SUMMARY"
            echo "esté aplicado: crea la tabla \`medios.wordcloud_terms\` y la función" >> "$GITHUB_STEP_SUMMARY"
            echo "\`public.truncate_wordcloud_terms\`, ambas obligatorias para el script." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "listo=false" >> "$GITHUB_OUTPUT"
          {
            echo "### ⏭️ Build omitido — configuración pendiente"
            echo ""
            echo "Faltan estos secrets del repositorio:"
            echo ""
            for s in "${faltan[@]}"; do echo "- \`$s\`"; done
            echo ""
            echo "Se añaden en **Settings → Secrets and variables → Actions**."
            echo "\`SUPABASE_SERVICE_ROLE_KEY\` debe ser la *service_role* key del"
            echo "proyecto Supabase, nunca la *anon* key (el script escribe en la"
            echo "base de datos y necesita saltarse RLS)."
            echo ""
            echo "Además, antes de la primera ejecución real hay que aplicar"
            echo "\`supabase/wordcloud.sql\` en el proyecto: crea la tabla"
            echo "\`medios.wordcloud_terms\` y la función \`public.truncate_wordcloud_terms\`."
            echo ""
            echo "El job termina en verde a propósito: sin estas piezas el script no"
            echo "puede funcionar, y fallar a diario no aporta información nueva."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Python
        if: steps.preflight.outputs.listo == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        if: steps.preflight.outputs.listo == 'true'
        run: pip install -r requirements.txt

      - name: Build wordcloud aggregates
        if: steps.preflight.outputs.listo == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_SOURCE_SCHEMA: ${{ vars.SUPABASE_SOURCE_SCHEMA || 'medios' }}
          SUPABASE_SOURCE_TABLE: ${{ vars.SUPABASE_SOURCE_TABLE || 'noticias' }}
          SUPABASE_TARGET_SCHEMA: ${{ vars.SUPABASE_TARGET_SCHEMA || 'medios' }}
          SUPABASE_TARGET_TABLE: ${{ vars.SUPABASE_TARGET_TABLE || 'wordcloud_terms' }}
          WORDCLOUD_MAX_TERMS: ${{ vars.WORDCLOUD_MAX_TERMS || '80' }}
          WORDCLOUD_MIN_DOC_FREQ: ${{ vars.WORDCLOUD_MIN_DOC_FREQ || '2' }}
        run: python scripts/build_wordcloud_terms.py
