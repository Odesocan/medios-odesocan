# ──────────────────────────────────────────────────────────────────────────────
# Comprobaciones de instrumentación — ODESOCAN
# Verifica que el pipeline sigue registrando lo que el cuaderno metodológico
# dice que registra: denominador, observaciones, sello del clasificador,
# procedencia de la fecha y corte temporal del agregado.
#
# No toca la red ni la base de datos: usa HTML de prueba y SQLite temporal.
# ──────────────────────────────────────────────────────────────────────────────

name: Comprobaciones

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      # Solo lo que necesitan las comprobaciones. spaCy no hace falta: el
      # clasificador funciona sin vectores, y los tests no dependen de su
      # criterio, sino de que el pipeline guarde lo que debe guardar.
      #
      # psycopg2-binary SÍ hace falta, aunque las comprobaciones no toquen la
      # base de datos: SeleccionDeCabeceras carga scheduler.py, que importa
      # supabase_loader, que hace `import psycopg2` en el cuerpo del módulo.
      # Basta con que el módulo se pueda importar. Versión igual a la de
      # requirements-ci.txt para no abrir una segunda fuente de verdad.
      - name: Instalar dependencias
        run: |
          pip install --upgrade pip
          pip install feedparser httpx beautifulsoup4 lxml psycopg2-binary==2.9.10

      - name: Ejecutar comprobaciones
        run: python -m unittest discover -s tests -v
