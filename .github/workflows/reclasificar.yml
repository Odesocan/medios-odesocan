# ──────────────────────────────────────────────────────────────────────────────
# Reclasificar el corpus — ODESOCAN
#
# Reetiqueta medios.noticias con la versión vigente del clasificador y sella la
# columna `clasificador_version`.
#
# POR QUÉ AQUÍ Y NO EN LOCAL: la huella del clasificador incluye el modelo de
# spaCy cargado, porque sin vectores el motor degrada a palabras clave y URL y
# clasifica distinto. Ejecutarlo en una máquina sin `es_core_news_md` sellaría
# el corpus con una huella que no corresponde a la de producción, que es
# exactamente el problema que esta columna viene a resolver. Este workflow
# instala el mismo modelo que el scraping diario.
#
# Solo se dispara a mano, y por defecto en seco.
# ──────────────────────────────────────────────────────────────────────────────

name: Reclasificar corpus

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Solo medir la deriva, sin escribir"
        type: boolean
        required: true
        default: true
      todas:
        description: "Revisar el corpus entero (necesario para el primer sellado)"
        type: boolean
        required: false
        default: false
      limit:
        description: "Máximo de piezas a revisar (vacío = sin límite)"
        required: false
        default: ""

jobs:
  reclasificar:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      SUPABASE_HOST:     ${{ secrets.SUPABASE_HOST }}
      SUPABASE_PORT:     ${{ secrets.SUPABASE_PORT }}
      SUPABASE_DBNAME:   ${{ secrets.SUPABASE_DBNAME }}
      SUPABASE_USER:     ${{ secrets.SUPABASE_USER }}
      SUPABASE_PASSWORD: ${{ secrets.SUPABASE_PASSWORD }}
      SUPABASE_SSLMODE:  ${{ secrets.SUPABASE_SSLMODE }}
      SUPABASE_SCHEMA:   ${{ secrets.SUPABASE_SCHEMA }}

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v5

      - name: Configurar Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements/pipeline.txt

      - name: Instalar dependencias del sistema
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libxml2-dev libxslt1-dev

      - name: Instalar dependencias Python
        run: |
          pip install --upgrade pip
          pip install -r requirements/pipeline.txt

      - name: Descargar modelo spaCy español
        run: python -m spacy download es_core_news_md

      - name: Mostrar la versión del clasificador
        run: python bin/reclasificar.py --version

      - name: Reclasificar
        run: |
          args=""
          [ "${{ inputs.dry_run }}" = "true" ] && args="$args --dry-run"
          [ "${{ inputs.todas }}"   = "true" ] && args="$args --todas"
          [ -n "${{ inputs.limit }}" ]         && args="$args --limit ${{ inputs.limit }}"
          echo "Ejecutando: python bin/reclasificar.py $args"
          python bin/reclasificar.py $args | tee /tmp/salida.txt

      - name: Resumen del job
        if: always()
        run: |
          {
            echo "### Reclasificación del corpus"
            echo ""
            if [ "${{ inputs.dry_run }}" = "true" ]; then
              echo "Ejecutado en **seco**: no se ha escrito nada en la base."
            else
              echo "Ejecutado **en firme**: el corpus ha sido reetiquetado."
            fi
            echo ""
            echo '```'
            cat /tmp/salida.txt 2>/dev/null || echo "(sin salida)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
